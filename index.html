<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINOX METHOD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #04070d; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .ambient-glow-1 { position: absolute; width: 350px; height: 350px; background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, rgba(0,0,0,0) 70%); top: 15%; left: 5%; filter: blur(50px); }
        .ambient-glow-2 { position: absolute; width: 380px; height: 380px; background: radial-gradient(circle, rgba(255, 0, 128, 0.2) 0%, rgba(0,0,0,0) 70%); bottom: 10%; right: 5%; filter: blur(60px); }
        .card { position: relative; z-index: 10; width: 100%; max-width: 440px; background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(25px); border: 1.5px solid rgba(0, 255, 170, 0.35); border-radius: 28px; padding: 36px 26px; box-shadow: 0 0 35px rgba(0, 255, 170, 0.15), 0 20px 50px rgba(0, 0, 0, 0.9); text-align: center; }
        h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #00f2fe 0%, #00ffaa 50%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .subtitle { font-size: 0.88rem; color: #8fa0b5; margin-bottom: 20px; margin-top: 5px; }
        .drop-zone { border: 2px dashed rgba(0, 255, 170, 0.45); border-radius: 20px; padding: 30px 18px; background: rgba(12, 19, 32, 0.6); cursor: pointer; transition: all 0.35s ease; }
        .drop-zone:hover { border-color: #00ffaa; background: rgba(16, 27, 46, 0.8); }
        .icon-box { font-size: 2.8rem; margin-bottom: 10px; }
        .drop-title { font-size: 1rem; font-weight: 700; color: #ffffff; word-break: break-all; }
        .drop-sub { font-size: 0.8rem; color: #64748b; }
        .btn-main { width: 100%; margin-top: 24px; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, #00ffaa 0%, #00b894 100%); color: #04070d; font-weight: 900; font-size: 1rem; cursor: pointer; text-transform: uppercase; }
        .btn-main:disabled { opacity: 0.3; cursor: not-allowed; }
        .progress-box { display: none; margin-top: 22px; background: rgba(13, 20, 33, 0.8); border: 1px solid rgba(0, 255, 170, 0.2); border-radius: 16px; padding: 16px; }
        .status-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .status-text { font-size: 0.83rem; color: #00ffaa; font-weight: 700; }
        .status-percent { font-size: 0.85rem; color: #ffffff; font-weight: 800; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00f2fe 0%, #00ffaa 100%); border-radius: 10px; transition: width 0.2s ease-out; }
        .btn-download { display: none; width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, #00f2fe 0%, #00ffaa 100%); color: #04070d; font-weight: 900; font-size: 0.98rem; cursor: pointer; text-transform: uppercase; }
        .error-message { display: none; color: #ff4757; font-size: 0.85rem; font-weight: 600; margin-top: 14px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<div class="card">
    <h1>BINOX METHOD</h1>
    <p class="subtitle">Bypass de compresión para TikTok en un solo clic.</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon-box" id="iconBox">✨</div>
        <div class="drop-title" id="dropTitle">Arrastra tu edit aquí</div>
        <div class="drop-sub" id="dropSub">o haz clic para buscar en tus archivos</div>
    </div>

    <input type="file" id="fileInput" accept="video/*" onchange="handleFile(this.files[0])">

    <button id="startBtn" class="btn-main" onclick="processVideo()" disabled>OPTIMIZAR EDIT</button>

    <div id="progressBox" class="progress-box">
        <div class="status-header">
            <span id="statusText" class="status-text">Iniciando...</span>
            <span id="statusPercent" class="status-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadResult()">⬇ DESCARGAR EDIT OPTIMIZADO</button>
    <div id="errorText" class="error-message">Error al procesar el video. Reintenta de nuevo.</div>
</div>

<script>
    const BACKEND_URL = "https://binox-backend-production.up.railway.app/bypass";
    let selectedFile = null;
    let preparedBlobUrl = null;
    let outputName = "";
    let processInterval = null;
    let currentProgress = 0;

    function setProgress(percent, text) {
        if (percent > currentProgress) currentProgress = percent;
        document.getElementById('progressBar').style.width = currentProgress + "%";
        document.getElementById('statusPercent').innerText = Math.round(currentProgress) + "%";
        if (text) document.getElementById('statusText').innerText = text;
    }

    function handleFile(file) {
        if (!file) return;
        selectedFile = file;
        document.getElementById('dropTitle').innerText = file.name;
        document.getElementById('dropSub').innerText = "Archivo listo para procesar";
        document.getElementById('iconBox').innerText = "🎬";
        document.getElementById('startBtn').disabled = false;
        document.getElementById('progressBox').style.display = 'none';
        document.getElementById('downloadBtn').style.display = 'none';
        document.getElementById('errorText').style.display = 'none';
    }

    function processVideo() {
        if (!selectedFile) return;

        const startBtn = document.getElementById('startBtn');
        const progressBox = document.getElementById('progressBox');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorText = document.getElementById('errorText');

        if (processInterval) clearInterval(processInterval);
        currentProgress = 0;

        startBtn.disabled = true;
        downloadBtn.style.display = 'none';
        errorText.style.display = 'none';
        progressBox.style.display = 'block';

        setProgress(0, "Subiendo archivo...");

        const formData = new FormData();
        formData.append("file", selectedFile);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", BACKEND_URL, true);
        xhr.responseType = "blob";

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const uploadPercent = (e.loaded / e.total) * 70;
                setProgress(uploadPercent, uploadPercent < 70 ? "Subiendo archivo..." : "Aplicando parche...");
            }
        };

        xhr.upload.onload = function() {
            setProgress(70, "Aplicando parche BINOX...");
            processInterval = setInterval(() => {
                if (currentProgress < 98) {
                    setProgress(currentProgress + 0.8, "Optimizando contenedor...");
                }
            }, 300);
        };

        xhr.onload = function() {
            if (processInterval) clearInterval(processInterval);

            if (xhr.status === 200) {
                setProgress(100, "¡Edit listo!");

                const blob = xhr.response;
                if (preparedBlobUrl) window.URL.revokeObjectURL(preparedBlobUrl);
                preparedBlobUrl = window.URL.createObjectURL(blob);
                outputName = "binox_" + selectedFile.name;

                setTimeout(() => {
                    downloadBtn.style.display = 'block';
                    startBtn.disabled = false;
                }, 200);
            } else {
                startBtn.disabled = false;
                progressBox.style.display = 'none';
                errorText.innerText = "Error en el servidor al procesar el video.";
                errorText.style.display = 'block';
            }
        };

        xhr.onerror = function() {
            if (processInterval) clearInterval(processInterval);
            startBtn.disabled = false;
            progressBox.style.display = 'none';
            errorText.innerText = "Error de conexión con el servidor.";
            errorText.style.display = 'block';
        };

        xhr.send(formData);
    }

    function downloadResult() {
        if (!preparedBlobUrl) return;
        const a = document.createElement("a");
        a.href = preparedBlobUrl;
        a.download = outputName;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }
</script>

</body>
</html>
