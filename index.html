<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINOX STUDIO - Bypass</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-hover: #059669;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --border-color: #1f2937;
            --error-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .icon-box {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .drop-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .drop-sub {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .drop-limit {
            font-size: 0.75rem;
            color: var(--accent-green);
            margin-top: 8px;
            font-weight: 700;
        }

        button {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #374151;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #fileInput {
            display: none;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .progress-container {
            margin-top: 15px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-green);
            transition: width 0.2s;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BINOX STUDIO</h1>
    
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon-box" id="iconBox">✨</div>
        <div class="drop-title" id="dropTitle">Arrastra tu edit aquí</div>
        <div class="drop-sub" id="dropSub">o haz clic para buscarlo</div>
        <div class="drop-limit">⚡ TAMAÑO MÁXIMO: 150 MB</div>
    </div>

    <input type="file" id="fileInput" accept="video/*" onchange="handleFile(this.files[0])">

    <button id="startBtn" onclick="processVideo()" disabled>PROCESAR VIDEO</button>

    <div class="error-msg" id="errorText"></div>

    <div class="progress-container" id="progressBox">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="statusText" style="font-size:0.8rem; color:var(--text-sub); margin-top:5px;">Subiendo...</p>
    </div>

    <a id="downloadBtn" style="display:none; text-decoration:none;" download>
        <button style="margin-top: 15px; background-color: #2563eb;">DESCARGAR RESULTADO</button>
    </a>
</div>

<script>
    let selectedFile = null;
    // REEMPLAZA ESTA URL CON TU LINK REAL DE RAILWAY
    const BACKEND_URL = "https://tu-app.up.railway.app"; 

    function handleFile(file) {
        if (!file) return;

        const MAX_SIZE_MB = 150;
        const maxSizeBytes = MAX_SIZE_MB * 1024 * 1024;
        const errorText = document.getElementById('errorText');

        if (file.size > maxSizeBytes) {
            errorText.innerText = `El archivo supera el límite de ${MAX_SIZE_MB} MB.`;
            errorText.style.display = 'block';
            document.getElementById('startBtn').disabled = true;
            return;
        }

        errorText.style.display = 'none';
        selectedFile = file;
        document.getElementById('dropTitle').innerText = file.name;
        document.getElementById('dropSub').innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB · Listo`;
        document.getElementById('iconBox').innerText = "🎬";
        document.getElementById('startBtn').disabled = false;
    }

    function processVideo() {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append("file", selectedFile);

        const xhr = new XMLHttpRequest();
        const progressBox = document.getElementById('progressBox');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');

        progressBox.style.display = 'block';
        startBtn.disabled = true;

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressFill.style.width = percent + '%';
                statusText.innerText = `Procesando: ${percent}%`;
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                const blob = new Blob([xhr.response], { type: 'video/mp4' });
                const downloadUrl = URL.createObjectURL(blob);
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = downloadUrl;
                downloadBtn.download = "bypass_" + selectedFile.name;
                downloadBtn.style.display = 'block';
                statusText.innerText = "¡Completado con éxito!";
            } else {
                statusText.innerText = "Error al procesar el video.";
            }
        };

        xhr.responseType = 'blob';
        xhr.open("POST", `${BACKEND_URL}/bypass-fast`, true);
        xhr.send(formData);
    }
</script>

</body>
</html>
