<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINOX METHOD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #4da6ff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .info-card {
            background-color: #121324;
            border: 1px solid #1f223d;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #a0a5c0;
            line-height: 1.4;
        }

        .info-card h3 {
            color: #3b82f6;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .drop-zone {
            border: 2px dashed #2d325a;
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            background-color: #121324;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #3b82f6;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #4da6ff, #2563eb);
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #1f223d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4da6ff, #9333ea);
            transition: width 0.2s;
        }

        .status-text {
            font-size: 0.8rem;
            color: #a0a5c0;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BINOX METHOD</h1>

    <div class="info-card">
        <h3>¿Cómo funciona?</h3>
        Nuestra herramienta optimiza la estructura visual y los metadatos de tu archivo para mantener la máxima nitidez posible al publicarlo, garantizando que el algoritmo respete tu calidad original.
    </div>

    <div class="drop-zone" onclick="document.getElementById('videoInput').click()">
        <div class="icon">🎬</div>
        <div id="selectText">Arrastra o toca para buscar</div>
    </div>

    <input type="file" id="videoInput" accept="video/*" onchange="handleFileSelect(event)">

    <button id="optimizeBtn" class="btn" onclick="startOptimization()" disabled>OPTIMIZAR EDIT</button>

    <div id="progressContainer" class="progress-container">
        <div id="statusText" class="status-text">Procesando... 0%</div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://binox-backend-production.up.railway.app/bypass";
    let selectedFile = null;

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            selectedFile = file;
            document.getElementById('selectText').innerText = "Seleccionado: " + file.name;
            document.getElementById('optimizeBtn').disabled = false;
            
            // Reiniciar estado visual de progreso
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('statusText').innerText = "Procesando... 0%";
        }
    }

    function startOptimization() {
        if (!selectedFile) return;

        const btn = document.getElementById('optimizeBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');

        btn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        statusText.innerText = "Enviando al servidor... 0%";

        const formData = new FormData();
        formData.append("file", selectedFile);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", BACKEND_URL, true);
        xhr.responseType = "blob";

        // Actualizar porcentaje de carga del cliente al servidor
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 50); // Subida es el 50% del proceso
                progressBar.style.width = percent + "%";
                statusText.innerText = "Subiendo archivo... " + percent + "%";
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                progressBar.style.width = "100%";
                statusText.innerText = "¡Completado! Descargando video...";

                // Generar descarga del video devuelto
                const blob = xhr.response;
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = downloadUrl;
                a.download = "binox_" + selectedFile.name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                setTimeout(() => {
                    btn.disabled = false;
                }, 2000);
            } else {
                btn.disabled = false;
                statusText.innerText = "Error en el servidor (" + xhr.status + ")";
                alert("Ocurrió un error al procesar el video en el servidor.");
            }
        };

        xhr.onerror = function() {
            btn.disabled = false;
            statusText.innerText = "Error de conexión";
            alert("No se pudo conectar con el servidor de Railway.");
        };

        xhr.send(formData);
    }
</script>

</body>
</html>
