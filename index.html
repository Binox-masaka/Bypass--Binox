<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINOX STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --accent-cyan: #00f2fe;
            --accent-green: #00ffaa;
            --accent-pink: #ff007f;
            --accent-purple: #7928ca;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 255, 170, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 1;
            animation: pulseOrb 8s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, var(--accent-cyan) 0%, rgba(0,0,0,0) 70%);
            top: -10%;
            left: -10%;
            opacity: 0.45;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent-purple) 0%, rgba(0,0,0,0) 70%);
            bottom: -15%;
            right: -10%;
            opacity: 0.5;
            animation-delay: -4s;
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(30px, -20px); }
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid var(--border-glow);
            border-radius: 32px;
            padding: 40px 30px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(0, 255, 170, 0.08),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(0, 255, 170, 0.45);
        }

        .title-wrapper {
            margin-bottom: 24px;
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid rgba(0, 255, 170, 0.25);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .badge-tag span {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-top: 8px;
            font-weight: 500;
            line-height: 1.4;
        }

        .method-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 6px;
            margin-bottom: 22px;
        }

        .method-btn {
            padding: 12px 10px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .method-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(0, 255, 170, 0.15) 100%);
            border: 1px solid rgba(0, 255, 170, 0.35);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 255, 170, 0.15);
        }

        .method-btn span.tag {
            font-size: 0.68rem;
            color: var(--accent-cyan);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .drop-zone {
            position: relative;
            border: 2px dashed rgba(0, 255, 170, 0.3);
            border-radius: 24px;
            padding: 36px 20px;
            background: rgba(15, 23, 42, 0.4);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .drop-zone:hover {
            border-color: var(--accent-green);
            background: rgba(0, 255, 170, 0.03);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 170, 0.08);
        }

        .icon-box {
            font-size: 2.5rem;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .drop-zone:hover .icon-box {
            transform: scale(1.15) rotate(-5deg);
        }

        .drop-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #ffffff;
            word-break: break-all;
        }

        .drop-sub {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .drop-limit {
            font-size: 0.72rem;
            color: var(--accent-green);
            margin-top: 8px;
            font-weight: 800;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .btn-main {
            width: 100%;
            margin-top: 22px;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-green) 100%);
            color: #030712;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0, 255, 170, 0.25);
            transition: all 0.3s ease;
        }

        .btn-main:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 255, 170, 0.4);
            filter: brightness(1.1);
        }

        .btn-main:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            box-shadow: none;
        }

        .progress-box {
            display: none;
            margin-top: 22px;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid rgba(0, 255, 170, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-text {
            font-size: 0.82rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .status-percent {
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: 800;
            font-family: monospace;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan) 0%, var(--accent-green) 50%, var(--accent-pink) 100%);
            background-size: 200% 100%;
            border-radius: 10px;
            transition: width 0.25s ease-out;
            animation: gradientMove 2s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .btn-download {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #00f2fe 0%, #ff007f 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.45);
        }

        .error-message {
            display: none;
            color: #ff4757;
            font-size: 0.82rem;
            font-weight: 700;
            margin-top: 16px;
            background: rgba(255, 71, 87, 0.1);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 71, 87, 0.2);
            animation: fadeIn 0.3s ease;
        }

        .footer-credits {
            margin-top: 24px;
            font-size: 0.72rem;
            color: var(--text-sub);
            opacity: 0.75;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-credits strong {
            color: var(--text-main);
            font-weight: 800;
        }

        input[type="file"] { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>

<div class="card">
    <div class="title-wrapper">
        <div class="badge-tag"><span></span> Bypass System v2.4</div>
        <h1>BINOX STUDIO</h1>
        <p class="subtitle">Bypass de compresión HD para TikTok en segundos.</p>
    </div>

    <div class="method-selector">
        <button id="btnMethodFast" class="method-btn active" onclick="selectMethod('fast')">
            ⚡ Bypass
            <span class="tag">Ultra HD · 1080p 120 FPS</span>
        </button>
        <button id="btnMethodFfmpeg" class="method-btn" onclick="selectMethod('ffmpeg')">
            ⚙️ FFmpeg
            <span class="tag">Standard · 720p 60 FPS</span>
        </button>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon-box" id="iconBox">✨</div>
        <div class="drop-title" id="dropTitle">Arrastra tu edit aquí</div>
        <div class="drop-sub" id="dropSub">o haz clic para explorar en tus archivos</div>
        <div class="drop-limit">⚡ TAMAÑO MÁXIMO: 150 MB</div>
    </div>

    <input type="file" id="fileInput" accept="video/*" onchange="handleFile(this.files[0])">

    <button id="startBtn" class="btn-main" onclick="processVideo()" disabled>OPTIMIZAR EDIT</button>

    <div id="progressBox" class="progress-box">
        <div class="status-header">
            <span id="statusText" class="status-text">Iniciando motor...</span>
            <span id="statusPercent" class="status-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <button id="downloadBtn" class="btn-download" onclick="downloadResult()">⬇ DESCARGAR EDIT OPTIMIZADO</button>
    <div id="errorText" class="error-message">Error al procesar el video. Reintenta de nuevo.</div>

    <div class="footer-credits">
        Powered by BINOX Engine · <strong>BINOX</strong>
    </div>
</div>

<script>
    const BASE_BACKEND_URL = "https://binox-backend-production.up.railway.app";
    const BINOX_KEY = "my_binox_super_bypass_123";
    
    let currentEndpoint = `${BASE_BACKEND_URL}/bypass-fast`;
    let selectedFile = null;
    let preparedBlobUrl = null;
    let outputName = "";
    let processInterval = null;
    let currentProgress = 0;

    function selectMethod(method) {
        const btnFast = document.getElementById('btnMethodFast');
        const btnFfmpeg = document.getElementById('btnMethodFfmpeg');

        if (method === 'fast') {
            currentEndpoint = `${BASE_BACKEND_URL}/bypass-fast`;
            btnFast.classList.add('active');
            btnFfmpeg.classList.remove('active');
        } else {
            currentEndpoint = `${BASE_BACKEND_URL}/bypass`;
            btnFfmpeg.classList.add('active');
            btnFast.classList.remove('active');
        }
    }

    function setProgress(percent, text) {
        if (percent > currentProgress) currentProgress = percent;
        document.getElementById('progressBar').style.width = currentProgress + "%";
        document.getElementById('statusPercent').innerText = Math.round(currentProgress) + "%";
        if (text) document.getElementById('statusText').innerText = text;
    }

    function handleFile(file) {
        if (!file) return;

        const errorText = document.getElementById('errorText');
        const MAX_SIZE_MB = 150;
        const maxSizeBytes = MAX_SIZE_MB * 1024 * 1024;

        if (file.size > maxSizeBytes) {
            errorText.innerText = `El archivo supera el límite de ${MAX_SIZE_MB} MB. Elige un video más liviano.`;
            errorText.style.display = 'block';
            document.getElementById('startBtn').disabled = true;
            return;
        }

        selectedFile = file;
        document.getElementById('dropTitle').innerText = file.name;
        document.getElementById('dropSub').innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB · Listo para procesar`;
        document.getElementById('iconBox').innerText = "🎬";
        document.getElementById('startBtn').disabled = false;
        document.getElementById('progressBox').style.display = 'none';
        document.getElementById('downloadBtn').style.display = 'none';
        errorText.style.display = 'none';
    }

    function processVideo() {
        if (!selectedFile) return;

        const startBtn = document.getElementById('startBtn');
        const progressBox = document.getElementById('progressBox');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorText = document.getElementById('errorText');

        if (processInterval) clearInterval(processInterval);
        currentProgress = 0;

        startBtn.disabled = true;
        downloadBtn.style.display = 'none';
        errorText.style.display = 'none';
        progressBox.style.display = 'block';

        setProgress(0, "Subiendo al servidor...");

        const formData = new FormData();
        formData.append("file", selectedFile);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", currentEndpoint, true);
        
        // Firma de seguridad para el backend en Railway
        xhr.setRequestHeader("X-BINOX-KEY", BINOX_KEY);
        
        xhr.responseType = "blob";

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const uploadPercent = (e.loaded / e.total) * 60;
                setProgress(uploadPercent, uploadPercent < 60 ? "Subiendo archivo..." : "Iniciando procesamiento...");
            }
        };

        xhr.upload.onload = function() {
            setProgress(60, "Aplicando optimización BINOX...");
            processInterval = setInterval(() => {
                if (currentProgress < 98) {
                    setProgress(currentProgress + 1.2, "Optimizando contenedor MP4...");
                }
            }, 250);
        };

        xhr.onload = function() {
            if (processInterval) clearInterval(processInterval);

            if (xhr.status === 200) {
                setProgress(100, "¡Edit optimizado con éxito!");

                const blob = xhr.response;
                if (preparedBlobUrl) window.URL.revokeObjectURL(preparedBlobUrl);
                preparedBlobUrl = window.URL.createObjectURL(blob);
                
                // Nombre asignado con el prefijo solicitado
                outputName = "binox_bypass_" + selectedFile.name;

                setTimeout(() => {
                    downloadBtn.style.display = 'block';
                    startBtn.disabled = false;
                }, 200);
            } else {
                startBtn.disabled = false;
                progressBox.style.display = 'none';
                
                // Intentar leer el mensaje devuelto por el servidor
                const reader = new FileReader();
                reader.onload = function() {
                    try {
                        const res = JSON.parse(reader.result);
                        errorText.innerText = res.detail || res.error || "Error al procesar el archivo.";
                    } catch(e) {
                        errorText.innerText = "Error en el servidor al procesar el video.";
                    }
                    errorText.style.display = 'block';
                };
                reader.readAsText(xhr.response);
            }
        };

        xhr.onerror = function() {
            if (processInterval) clearInterval(processInterval);
            startBtn.disabled = false;
            progressBox.style.display = 'none';
            errorText.innerText = "Error de conexión o bloqueo de acceso con el servidor.";
            errorText.style.display = 'block';
        };

        xhr.send(formData);
    }

    function downloadResult() {
        if (!preparedBlobUrl) return;
        const a = document.createElement("a");
        a.href = preparedBlobUrl;
        a.download = outputName;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--accent-green)';
            dropZone.style.background = 'rgba(0, 255, 170, 0.08)';
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(0, 255, 170, 0.3)';
            d
