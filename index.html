<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINOX | Bypass Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f17;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --border-hover: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-start: #4f46e5;
            --accent-end: #7c3aed;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            margin-top: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Zona Drop File */
        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.4);
            position: relative;
            margin-bottom: 20px;
        }

        .dropzone:hover {
            border-color: var(--border-hover);
            background: rgba(59, 130, 246, 0.04);
        }

        .dropzone input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .drop-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: block;
        }

        .drop-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .drop-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .file-selected {
            font-size: 0.85rem;
            font-weight: 600;
            color: #818cf8;
            margin-top: 8px;
            word-break: break-all;
        }

        /* Botón Principal */
        .btn-submit {
            width: 100%;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Panel de Progreso */
        .progress-panel {
            display: none;
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.825rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .status-text {
            color: var(--text-secondary);
        }

        .percent-text {
            color: #818cf8;
            font-weight: 600;
        }

        .bar-bg {
            height: 7px;
            background: #1e293b;
            border-radius: 9999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
            border-radius: 9999px;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1 class="brand-title">BINOX</h1>
            <span class="badge">TikTok Quality Bypass v2</span>
            <p class="subtitle">Corrige codificación y metadatos para evitar que TikTok comprima tus videos a 576p.</p>
        </div>

        <form id="bypassForm">
            <div class="dropzone">
                <span class="drop-icon">📁</span>
                <span class="drop-text" id="dropLabel">Selecciona o arrastra tu video</span>
                <p class="drop-hint" id="dropHint">Formatos soportados: .mp4, .mov (Max 60 FPS)</p>
                <div class="file-selected" id="fileName"></div>
                <input type="file" id="videoInput" accept="video/*" required>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Procesar Video</button>
        </form>

        <div class="progress-panel" id="progressPanel">
            <div class="progress-info">
                <span class="status-text" id="statusText">Preparando...</span>
                <span class="percent-text" id="percentText">0%</span>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" id="barFill"></div>
            </div>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const fileName = document.getElementById('fileName');
        const dropLabel = document.getElementById('dropLabel');
        const dropHint = document.getElementById('dropHint');
        const bypassForm = document.getElementById('bypassForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const progressPanel = document.getElementById('progressPanel');
        const barFill = document.getElementById('barFill');
        const percentText = document.getElementById('percentText');
        const statusText = document.getElementById('statusText');

        videoInput.addEventListener('change', () => {
            if (videoInput.files.length > 0) {
                fileName.textContent = "🎬 " + videoInput.files[0].name;
                dropLabel.style.display = 'none';
                dropHint.style.display = 'none';
            }
        });

        bypassForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!videoInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', videoInput.files[0]);

            btnSubmit.disabled = true;
            progressPanel.style.display = 'block';
            barFill.style.width = '0%';
            percentText.textContent = '0%';
            statusText.textContent = 'Subiendo al servidor...';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/bypass', true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    barFill.style.width = percent + '%';
                    percentText.textContent = percent + '%';
                    
                    if (percent === 100) {
                        statusText.textContent = 'Optimizando metadatos y FFmpeg...';
                    }
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    statusText.textContent = '¡Completado! Descargando video...';
                    
                    const blob = xhr.response;
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'binox_' + videoInput.files[0].name;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    setTimeout(() => {
                        btnSubmit.disabled = false;
                        statusText.textContent = 'Listo para otro archivo';
                    }, 3000);
                } else {
                    statusText.textContent = 'Error en el servidor';
                    alert('Error al procesar el video.');
                    btnSubmit.disabled = false;
                }
            };

            xhr.onerror = () => {
                statusText.textContent = 'Error de conexión';
                alert('No se pudo conectar con el servidor.');
                btnSubmit.disabled = false;
            };

            xhr.responseType = 'blob';
            xhr.send(formData);
        });
    </script>
</body>
</html>
