<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINOX | TikTok Quality Bypass</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090d;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --glass-bg: rgba(18, 20, 29, 0.65);
            --glass-border: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        /* Contenedor principal con efecto Glassmorphism */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 520px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.02);
            text-align: center;
            position: relative;
        }

        /* Título con Neón Animado */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            animation: glow 3s ease-in-out infinite alternate;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #a0a5c0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Zona Drop / Seleccionar archivo */
        .file-dropzone {
            border: 2px dashed rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
            margin-bottom: 25px;
        }

        .file-dropzone:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0, 243, 255, 0.03);
        }

        .file-dropzone input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .icon-upload {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            display: block;
        }

        .file-name {
            font-size: 1rem;
            color: var(--neon-cyan);
            margin-top: 8px;
            font-weight: 700;
            word-break: break-all;
        }

        /* Botón de Procesar */
        .btn-submit {
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 15px 30px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8), 0 0 15px rgba(255, 0, 85, 0.5);
            color: #fff;
        }

        .btn-submit:disabled {
            background: #222533;
            color: #555870;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Barra de Progreso */
        .progress-box {
            display: none;
            margin-top: 25px;
            text-align: left;
        }

        .progress-status {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #a0a5c0;
            font-weight: 700;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            box-shadow: 0 0 10px var(--neon-cyan);
            border-radius: 8px;
            transition: width 0.2s ease;
        }

        /* Estado del Procesamiento */
        .processing-pulse {
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.4)); }
            to { filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.6)); }
        }

        @keyframes pulseText {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BINOX</h1>
        <p class="subtitle">TIKTOK QUALITY BYPASS ENGINE</p>

        <form id="uploadForm">
            <div class="file-dropzone">
                <span class="icon-upload">⚡</span>
                <span id="labelSelect">Haz clic o arrastra tu video aquí</span>
                <div class="file-name" id="fileName"></div>
                <input type="file" id="videoInput" accept="video/*" required>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Procesar Video</button>
        </form>

        <div class="progress-box" id="progressBox">
            <div class="progress-status">
                <span id="statusText">Subiendo archivo...</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const fileNameDisplay = document.getElementById('fileName');
        const labelSelect = document.getElementById('labelSelect');
        const uploadForm = document.getElementById('uploadForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const percentText = document.getElementById('percentText');
        const statusText = document.getElementById('statusText');

        // Mostrar el nombre del archivo seleccionado
        videoInput.addEventListener('change', () => {
            if (videoInput.files.length > 0) {
                fileNameDisplay.textContent = "🎬 " + videoInput.files[0].name;
                labelSelect.style.display = "none";
            }
        });

        // Manejo del formulario y carga
        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!videoInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', videoInput.files[0]);

            btnSubmit.disabled = true;
            progressBox.style.display = 'block';
            progressBar.style.width = '0%';
            percentText.textContent = '0%';
            statusText.textContent = 'Subiendo al servidor...';
            statusText.classList.add('processing-pulse');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/bypass', true);

            // Barra de progreso de subida en tiempo real
            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percent + '%';
                    percentText.textContent = percent + '%';
                    
                    if (percent === 100) {
                        statusText.textContent = 'Aplicando Parche BINOX (FFmpeg)...';
                    }
                }
            };

            // Respuesta recibida
            xhr.onload = () => {
                if (xhr.status === 200) {
                    statusText.textContent = '¡Bypass Completado! Descargando...';
                    statusText.classList.remove('processing-pulse');
                    
                    // Convertir la respuesta binaria en archivo descargable
                    const blob = xhr.response;
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'binox_' + videoInput.files[0].name;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    setTimeout(() => {
                        btnSubmit.disabled = false;
                        statusText.textContent = '¡Listo!';
                    }, 2000);
                } else {
                    alert('Ocurrió un error al procesar el video.');
                    btnSubmit.disabled = false;
                    statusText.textContent = 'Error';
                }
            };

            xhr.onerror = () => {
                alert('Error de conexión con el servidor.');
                btnSubmit.disabled = false;
            };

            xhr.responseType = 'blob';
            xhr.send(formData);
        });
    </script>
</body>
</html>
