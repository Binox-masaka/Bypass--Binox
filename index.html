<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINOX | Pure JS FastStart Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05070d; --card: rgba(13, 18, 30, 0.85); --cyan: #00f2fe; --green: #00ff87; --pink: #ff007f; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: var(--card); backdrop-filter: blur(20px); border-radius: 24px; padding: 32px 28px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 0 40px rgba(0, 242, 254, 0.15); display: flex; flex-direction: column; gap: 20px; }
    .title { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .info-box { background: rgba(15, 23, 42, 0.6); border-left: 3px solid var(--green); border-radius: 14px; padding: 14px; font-size: 0.8rem; color: var(--muted); }
    .drop-zone { border: 2px dashed rgba(0, 255, 135, 0.4); background: rgba(10, 15, 28, 0.6); border-radius: 18px; padding: 28px 20px; text-align: center; cursor: pointer; }
    .drop-zone:hover { border-color: var(--cyan); background: rgba(0, 242, 254, 0.05); }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; text-decoration: none; text-align: center; display: block; }
    .btn-optimize { background: linear-gradient(135deg, var(--cyan), var(--green)); color: #000; }
    .btn-optimize:disabled { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.2); cursor: not-allowed; }
    .btn-download { display: none; background: linear-gradient(135deg, var(--green), var(--pink)); color: #fff; margin-top: 10px; }
    
    .status { text-align: center; font-size: 0.85rem; font-weight: 600; min-height: 20px; }
    .error { color: #ff4d4d; } .success { color: var(--green); }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">BINOX ENGINE</h1>
    <div class="info-box">⚡ <b>FastStart Nativo:</b> Reordena el átomo <code>moov</code> en JS puro a <code>IsStreamable: Yes</code> sin servidores ni descargas WASM.</div>
    
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 2rem; margin-bottom: 6px;">🎬</div>
      <div id="dropTitle" style="font-weight: 600;">Selecciona tu video</div>
      <div id="dropSub" style="font-size: 0.75rem; color: var(--muted);">formato MP4 recomendado</div>
      <input type="file" id="fileInput" accept="video/mp4,video/quicktime" style="display:none;" onchange="fileSelected(event)">
    </div>

    <button class="btn btn-optimize" id="btnOpt" onclick="processVideo()" disabled>PARCHEAR PARA TIKTOK STUDIO</button>
    
    <a class="btn btn-download" id="btnDl">⚡ DESCARGAR MP4 OPTIMIZADO</a>
    <div class="status" id="status"></div>
  </div>

  <script>
    let selectedFile = null;

    function fileSelected(e) {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        document.getElementById('dropTitle').innerText = selectedFile.name;
        document.getElementById('btnOpt').disabled = false;
        document.getElementById('status').innerText = "";
        document.getElementById('btnDl').style.display = "none";
      }
    }

    async function processVideo() {
      const status = document.getElementById('status');
      const btnOpt = document.getElementById('btnOpt');
      btnOpt.disabled = true;
      status.className = 'status';
      status.innerText = 'Analizando estructura de átomos MP4...';

      try {
        const buffer = await selectedFile.arrayBuffer();
        status.innerText = 'Reorganizando moov atom a FastStart (IsStreamable)...';
        
        const patchedBlob = makeFastStart(buffer);

        const dl = document.getElementById('btnDl');
        dl.href = URL.createObjectURL(patchedBlob);
        dl.download = `Binox_FastStart_${selectedFile.name}`;
        dl.style.display = 'block';

        status.className = 'status success';
        status.innerText = '¡Video optimizado en instantes! Listo para TikTok Studio.';
      } catch (err) {
        status.className = 'status error';
        status.innerText = 'Error: ' + err.message;
        btnOpt.disabled = false;
      }
    }

    // Algoritmo Pure JS para mover 'moov' al inicio y recalcular punteros stco/co64
    function makeFastStart(buffer) {
      const view = new DataView(buffer);
      let pos = 0;
      let ftyp = null, moov = null, mdat = null;
      let beforeMdat = [];

      while (pos < buffer.byteLength) {
        if (pos + 8 > buffer.byteLength) break;
        let size = view.getUint32(pos);
        const type = String.fromCharCode(view.getUint8(pos+4), view.getUint8(pos+5), view.getUint8(pos+6), view.getUint8(pos+7));

        let headerSize = 8;
        if (size === 1) {
          size = Number(view.getBigUint64(pos + 8));
          headerSize = 16;
        } else if (size === 0) {
          size = buffer.byteLength - pos;
        }

        const box = { type, pos, size, headerSize, data: buffer.slice(pos, pos + size) };

        if (type === 'ftyp') ftyp = box;
        else if (type === 'moov') moov = box;
        else if (type === 'mdat') mdat = box;
        else if (!mdat) beforeMdat.push(box);

        pos += size;
      }

      if (!moov || !mdat) {
        throw new Error("No se encontraron los bloques válidos moov o mdat.");
      }

      // Si moov ya está antes que mdat, el archivo ya es FastStart
      if (moov.pos < mdat.pos) {
        return new Blob([buffer], { type: 'video/mp4' });
      }

      // moov está después de mdat. Necesitamos recolocarlo antes e incrementar offsets en stco/co64
      const shiftSize = moov.size;
      const moovBuffer = moov.data.slice(0);
      const moovView = new DataView(moovBuffer);

      function patchOffsets(offset, length) {
        let p = offset;
        const end = offset + length;
        while (p < end - 8) {
          const boxSize = moovView.getUint32(p);
          if (boxSize < 8 || p + boxSize > end) break;
          const boxType = String.fromCharCode(moovView.getUint8(p+4), moovView.getUint8(p+5), moovView.getUint8(p+6), moovView.getUint8(p+7));

          if (boxType === 'stco') {
            const entryCount = moovView.getUint32(p + 12);
            for (let i = 0; i < entryCount; i++) {
              const currentOffset = moovView.getUint32(p + 16 + i * 4);
              moovView.setUint32(p + 16 + i * 4, currentOffset + shiftSize);
            }
          } else if (boxType === 'co64') {
            const entryCount = moovView.getUint32(p + 12);
            for (let i = 0; i < entryCount; i++) {
              const currentOffset = moovView.getBigUint64(p + 16 + i * 8);
              moovView.setBigUint64(p + 16 + i * 8, currentOffset + BigInt(shiftSize));
            }
          } else if (['trak', 'mdia', 'minf', 'stbl'].includes(boxType)) {
            patchOffsets(p + 8, boxSize - 8);
          }
          p += boxSize;
        }
      }

      patchOffsets(8, shiftSize - 8);

      const parts = [];
      if (ftyp) parts.push(ftyp.data);
      for (const b of beforeMdat) parts.push(b.data);
      parts.push(moovBuffer);
      parts.push(mdat.data);

      return new Blob(parts, { type: 'video/mp4' });
    }
  </script>
</body>
</html>
