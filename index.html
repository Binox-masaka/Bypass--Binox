<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINOX | Universal Engine</title>
  
  <script src="https://unpkg.com/coi-serviceworker/coi-serviceworker.min.js"></script>
  
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #05070d; --card: rgba(13, 18, 30, 0.85); --cyan: #00f2fe; --green: #00ff87; --pink: #ff007f; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: var(--card); backdrop-filter: blur(20px); border-radius: 24px; padding: 32px 28px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 0 40px rgba(0, 242, 254, 0.15); display: flex; flex-direction: column; gap: 20px; }
    .title { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .info-box { background: rgba(15, 23, 42, 0.6); border-left: 3px solid var(--green); border-radius: 14px; padding: 14px; font-size: 0.8rem; color: var(--muted); }
    .drop-zone { border: 2px dashed rgba(0, 255, 135, 0.4); background: rgba(10, 15, 28, 0.6); border-radius: 18px; padding: 28px 20px; text-align: center; cursor: pointer; }
    .drop-zone:hover { border-color: var(--cyan); background: rgba(0, 242, 254, 0.05); }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; text-decoration: none; text-align: center; display: block; }
    .btn-optimize { background: linear-gradient(135deg, var(--cyan), var(--green)); color: #000; }
    .btn-optimize:disabled { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.2); cursor: not-allowed; }
    .btn-download { display: none; background: linear-gradient(135deg, var(--green), var(--pink)); color: #fff; margin-top: 10px; }
    
    .progress-bar-container { background: rgba(255,255,255,0.1); border-radius: 10px; height: 10px; width: 100%; overflow: hidden; display: none; }
    .progress-bar { background: linear-gradient(90deg, var(--cyan), var(--green)); height: 100%; width: 0%; transition: width 0.3s; }
    .status { text-align: center; font-size: 0.8rem; font-weight: 600; }
    .error { color: #ff4d4d; } .success { color: var(--green); }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">BINOX ENGINE</h1>
    <div class="info-box">⚡ <b>Motor Local Activo:</b> Renderiza la estructura nativa MP4 H.264 para TikTok Studio directamente en tu navegador.</div>
    
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 2rem; margin-bottom: 6px;">🎬</div>
      <div id="dropTitle" style="font-weight: 600;">Selecciona tu video</div>
      <div id="dropSub" style="font-size: 0.75rem; color: var(--muted);">formato MP4 recomendado</div>
      <input type="file" id="fileInput" accept="video/mp4,video/quicktime" style="display:none;" onchange="fileSelected(event)">
    </div>

    <button class="btn btn-optimize" id="btnOpt" onclick="startProcessing()" disabled>PROCESAR PARA TIKTOK STUDIO</button>
    
    <div class="progress-bar-container" id="pBarContainer">
      <div class="progress-bar" id="pBar"></div>
    </div>

    <a class="btn btn-download" id="btnDl">⚡ DESCARGAR VIDEO RENDERIZADO</a>
    <div class="status" id="status"></div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let selectedFile = null;

    function fileSelected(e){
      selectedFile = e.target.files[0];
      if(selectedFile){
        document.getElementById('dropTitle').innerText = selectedFile.name;
        document.getElementById('btnOpt').disabled = false;
      }
    }

    async function startProcessing(){
      const status = document.getElementById('status');
      const pBarContainer = document.getElementById('pBarContainer');
      const pBar = document.getElementById('pBar');
      const btnOpt = document.getElementById('btnOpt');
      
      btnOpt.disabled = true;
      pBarContainer.style.display = 'block';
      pBar.style.width = '0%';
      status.className = 'status'; 
      status.innerText = 'Cargando motor local WASM...';

      try {
        if(!ffmpeg){
          ffmpeg = createFFmpeg({ log: false });
          
          ffmpeg.setProgress(({ ratio }) => {
            const pct = Math.round(ratio * 100);
            if(pct >= 0 && pct <= 100){
              pBar.style.width = `${pct}%`;
              status.innerText = `Procesando video localmente: ${pct}%`;
            }
          });
          await ffmpeg.load();
        }

        status.innerText = 'Leyendo archivo...';
        ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));

        status.innerText = 'Renderizando versión para TikTok Studio...';
        
        await ffmpeg.run(
          '-i', 'input.mp4',
          '-c:v', 'libx264',
          '-preset', 'ultrafast',
          '-crf', '16',
          '-g', '60',
          '-pix_fmt', 'yuv420p',
          '-movflags', '+faststart',
          'output.mp4'
        );

        const data = ffmpeg.FS('readFile', 'output.mp4');
        const blob = new Blob([data.buffer], { type: 'video/mp4' });
        
        const dl = document.getElementById('btnDl');
        dl.href = URL.createObjectURL(blob);
        dl.download = `Binox_TikTok_${selectedFile.name}`;
        dl.style.display = 'block';
        
        status.className = 'status success';
        status.innerText = '¡Renderizado exitoso! Video listo para subir.';
      } catch(err) {
        status.className = 'status error';
        status.innerText = 'Error: ' + err.message;
        btnOpt.disabled = false;
      }
    }
  </script>
</body>
</html>
