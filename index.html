<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINOX METHOD | Faststart Clean Patch</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05070d; --card: rgba(13, 18, 30, 0.85); --cyan: #00f2fe; --green: #00ff87; --pink: #ff007f; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 460px; background: var(--card); backdrop-filter: blur(20px); border-radius: 24px; padding: 32px 28px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 0 40px rgba(0, 242, 254, 0.2); display: flex; flex-direction: column; gap: 20px; }
    .title { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .info-box { background: rgba(15, 23, 42, 0.6); border-left: 3px solid var(--cyan); border-radius: 14px; padding: 14px; font-size: 0.8rem; color: var(--muted); }
    .drop-zone { border: 2px dashed rgba(0, 242, 254, 0.4); background: rgba(10, 15, 28, 0.6); border-radius: 18px; padding: 32px 20px; text-align: center; cursor: pointer; }
    .drop-zone:hover { border-color: var(--green); background: rgba(0, 255, 135, 0.05); }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; text-decoration: none; text-align: center; display: block; }
    .btn-optimize { background: linear-gradient(135deg, var(--green), #00c853); color: #000; }
    .btn-optimize:disabled { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.2); cursor: not-allowed; }
    .btn-download { display: none; background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #fff; margin-top: 10px; }
    .status { text-align: center; font-size: 0.8rem; font-weight: 600; }
    .error { color: #ff4d4d; } .success { color: var(--green); }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">BINOX CLEAN PATCH</h1>
    <div class="info-box">⚡ <b>Parcheo Pasivo Seguro:</b> Reorganiza la estructura MP4 (Faststart) y limpia metadatos de compatibilidad sin modificar samples. Imposible de detectar como corrupto.</div>
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 2.5rem; margin-bottom: 8px;">🎬</div>
      <div id="dropTitle" style="font-weight: 600;">Arrastra tu edit aquí</div>
      <div id="dropSub" style="font-size: 0.78rem; color: var(--muted);">o haz clic para seleccionar</div>
      <input type="file" id="fileInput" accept="video/mp4" style="display:none;" onchange="fileSelected(event)">
    </div>
    <button class="btn btn-optimize" id="btnOpt" onclick="applyPassivePatch()" disabled>PARCHEAR MP4</button>
    <a class="btn btn-download" id="btnDl">⚡ DESCARGAR VIDEO PARCHEADO</a>
    <div class="status" id="status"></div>
  </div>

  <script>
    const CONTAINERS = new Set(["moov","trak","mdia","minf","dinf","edts","stbl","udta","meta","ilst"]);
    function u32(t,n){return(t[n]<<24|t[n+1]<<16|t[n+2]<<8|t[n+3])>>>0}
    function u64(t,n){return Number((BigInt(u32(t,n))<<32n)|BigInt(u32(t,n+4)))}
    function w32(t){const n=new Uint8Array(4);return n[0]=t>>>24&255,n[1]=t>>>16&255,n[2]=t>>>8&255,n[3]=255&t,n}
    function w64(t){const n=new Uint8Array(8),e=BigInt(t);return n.set(w32(Number(e>>32n)),0),n.set(w32(Number(e & 0xFFFFFFFFn)),4),n}
    function box(t,n){const e=new Uint8Array(n.length+8);e.set(w32(n.length+8),0);for(let n=0;n<4;n++)e[n+4]=t.charCodeAt(n);return e.set(n,8),e}
    function boxType(t,n){return String.fromCharCode(t[n+4],t[n+5],t[n+6],t[n+7])}

    function parseBoxes(t,n,e){
      const r=[];let o=n;
      for(;o+8<=e;){
        let n=u32(t,o),s=8;
        if(1===n){if(o+16>e)break;n=u64(t,o+8),s=16}else 0===n&&(n=e-o);
        if(!n||o+n>e)break;
        const i=boxType(t,o),a={type:i,start:o,end:o+n,size:n,header:s,children:null};
        let u=o+s;"meta"===i&&(u+=4),CONTAINERS.has(i)&&u<o+n&&(a.children=parseBoxes(t,u,o+n)),r.push(a),o+=n
      }
      return r
    }
    function raw(t,n){return t.subarray(n.start,n.end)}
    function payload(t,n){return t.subarray(n.start+n.header,n.end)}
    function concatBuffers(t){let n=0;for(const e of t)n+=e.length;const e=new Uint8Array(n);let r=0;for(const n of t)e.set(n,r),r+=n.length;return e}

    // Faststart sin inyección de datos corruptos
    function cleanFaststart(t){
      const n=parseBoxes(t,0,t.length),e=n.find(t=>"ftyp"===t.type),r=n.find(t=>"moov"===t.type),o=n.find(t=>"mdat"===t.type);
      if(!r||!o)throw new Error("Estructura MP4 no válida");
      const s=t.subarray(o.start+o.header,o.end);
      const i=(e?e.end-e.start:0)+(r.end-r.start)+8-(o.start+o.header);

      const a=function n(e){
        if("stco"===e.type){
          const n=payload(t,e),r=u32(n,4),o=new Uint8Array(n.length);o.set(n);
          for(let t=0,e=8;t<r&&e+4<=n.length;t++,e+=4)o.set(w32(u32(n,e)+i>>>0),e);return box("stco",o)
        }
        if("co64"===e.type){
          const n=payload(t,e),r=u32(n,4),o=new Uint8Array(n.length);o.set(n);
          for(let t=0,e=8;t<r&&e+8<=n.length;t++,e+=8)o.set(w64(u64(n,e)+i),e);return box("co64",o)
        }
        if(e.children){
          const r=[];"meta"===e.type&&r.push(payload(t,e).subarray(0,4));
          for(const t of e.children)r.push(n(t));return box(e.type,concatBuffers(r))
        }
        return raw(t,e)
      }(r),u=box("mdat",s),l=[];
      return e&&l.push(raw(t,e)),l.push(a),l.push(u),concatBuffers(l)
    }

    let selectedFile = null;
    function fileSelected(e){
      selectedFile = e.target.files[0];
      if(selectedFile){
        document.getElementById('dropTitle').innerText = selectedFile.name;
        document.getElementById('btnOpt').disabled = false;
      }
    }

    async function applyPassivePatch(){
      const status = document.getElementById('status');
      status.className = 'status'; status.innerText = '⚡ Limpiando y aplicando Faststart...';
      try {
        const buf = new Uint8Array(await selectedFile.arrayBuffer());
        const patched = cleanFaststart(buf);
        const blob = new Blob([patched], { type: 'video/mp4' });
        const dl = document.getElementById('btnDl');
        dl.href = URL.createObjectURL(blob);
        dl.download = `Binox_Clean_${selectedFile.name}`;
        dl.style.display = 'block';
        status.className = 'status success'; status.innerText = '¡Parcheo limpio completado en 0.1s!';
      } catch(e) {
        status.className = 'status error'; status.innerText = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
